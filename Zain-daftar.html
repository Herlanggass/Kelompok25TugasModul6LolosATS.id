<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daftar</title>
    </head>
<body>

    <header>
        <nav aria-label="Navigasi halaman>">
            <a href="login.html">&larr; Kembali</a>
        </nav>
        <h1> Hallo, Selamat Datang</h1>
    </header>

    <main>

    <figure>
        <img src="asset/robot.png" alt="Ilustrasi robot AI">
    </figure>

    <section aria-labelledby="judul-daftar">
        <header>
        <h2 id="judul-daftar">Daftar</h2>
        <p>Daftar akun anda</p>
    </header>

        <form action="#" method="post">

            <p>
                <label for="daftar-nama">Nama Lengkap</label>
                <input type="text" id="daftar-nama" name="nama" placeholder="Masukan Nama Lengkap" autocomplete="name" required>
            </p>

            <p>
                <label for="daftar-email">Email</label>
                <input type="email" id="daftar-email" name="email" placeholder="Masukan Email" autocomplete="email" required>
            </p>

            <p>
                <label for="daftar-password">Password</label>
                <input type="password" id="daftar-password" name="password" placeholder="Masukan Password" autocomplete="new-password" required>
                <button type="button" aria-controls="daftar-password" aria-label="Tampilkan password">Tampilkan</button>
            </p>

            <p>
                <input type="checkbox" id="daftar-setuju" name="setuju" required>
                <label for="daftar-setuju">
                    Saya menyetujui <a href="terms.html">ketentuan layanan</a> dan <a href="privacy.html">kebijakan privasi</a>
                </label>
            </p>

            <p>
                <button type="submit">Daftar</button>
            </p>

        </form>

    <p>
        <button type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true" focusable="false">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
                Daftar dengan Google
        </button>
    </p>

    <footer>
        <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </footer>
    </section>

  </main>

</body>
</html>
